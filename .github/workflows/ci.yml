name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-cov
      - run: pytest tests/ -v --cov=src --cov-report=xml
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          JWT_SECRET: test-secret-key

  dependency-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install safety and pip-audit
        run: pip install safety pip-audit
      - name: Run pip-audit (OSV database)
        run: |
          pip install -r requirements.txt
          pip-audit --format=json --output=pip-audit-report.json || true
          pip-audit --format=columns
      - name: Run safety check (PyUp database)
        run: safety check -r requirements.txt --full-report || true
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-results
          path: pip-audit-report.json
      - name: Fail on critical vulnerabilities
        run: |
          pip-audit --format=json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          critical = [v for v in data.get('vulnerabilities', []) if 'CRITICAL' in str(v)]
          if critical:
              print(f'Found {len(critical)} critical vulnerabilities!')
              sys.exit(1)
          print('No critical vulnerabilities found.')
          "

  build:
    runs-on: ubuntu-latest
    needs: [test, dependency-scan]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t brain-demo-app .
